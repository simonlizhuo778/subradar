# 订阅雷达 SubRadar 一键部署
# 用法:cp .env.docker.example .env.docker && 修改密钥 && docker compose up -d --build
# 访问:http://localhost:${WEB_PORT}
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      # SQLite 数据文件落在挂载卷里,重建容器数据不丢
      DATABASE_URL: "file:./data/prod.db"
      JWT_SECRET: ${JWT_SECRET:?请在 .env.docker 中设置 JWT_SECRET}
      MASTER_KEY: ${MASTER_KEY:?请在 .env.docker 中设置 MASTER_KEY(64 位 hex)}
      SEED_DEMO: ${SEED_DEMO:-true}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./docker-data:/app/server/prisma/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
